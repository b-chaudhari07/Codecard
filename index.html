<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0c11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codecard — Your Codeforces, visualized</title>
    <meta name="description" content="Explore Codeforces stats and create a shareable profile card." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Codecard — Your Codeforces, visualized" />
    <meta property="og:description" content="Explore Codeforces stats and create a shareable profile card." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Codecard — Your Codeforces, visualized" />
    <meta name="twitter:description" content="Explore Codeforces stats and create a shareable profile card." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('codecard-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
